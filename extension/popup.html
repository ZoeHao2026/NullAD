<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NullAD Local</title><link rel="stylesheet" href="popup.css"></head>
<body><header><div><h1 data-i18n="title">NullAD 本地增强</h1><p data-i18n="subtitle">规则与免规则识别，可独立或一起使用</p></div><label><span class="sr-only" data-i18n="language">语言</span><select id="language"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label></header>
<main><section><strong id="site">—</strong><p id="status" role="status" data-i18n="loading">正在读取状态…</p><p id="permission" class="muted"></p><p id="hidden" class="muted"></p><label class="mode-row"><span data-i18n="mode">识别模式</span><select id="mode"><option value="off" data-i18n="off">关闭</option><option value="conservative" data-i18n="conservative">保守</option><option value="balanced" data-i18n="balanced">平衡</option></select></label><label class="layer-row"><input id="rules-enabled" type="checkbox" checked><span data-i18n="rulesLayer"></span></label><label class="layer-row"><input id="heuristics-enabled" type="checkbox" checked><span data-i18n="heuristicsLayer"></span></label><p class="muted" data-i18n="layerHint"></p><p id="rule-data" class="muted"></p><div class="buttons"><button id="enable-page" data-i18n="enablePage">仅本页启用</button><button id="enable-all" class="primary" data-i18n="enableAll">全部网页启用</button></div><p class="muted" data-i18n="permissionHint"></p><button id="stop" class="wide" data-i18n="stop">全部关闭并恢复</button></section>
<section><button id="allow-site" class="wide" data-i18n="allowSite">允许此站点</button><p id="allow-status" class="muted"></p><button id="restore" class="wide" data-i18n="restore">恢复本页隐藏内容</button><p class="muted" data-i18n="restoreHint"></p><button id="options" class="link" data-i18n="manage">管理站点允许项</button></section>
<p id="feedback" class="feedback" role="status"></p><p class="muted footnote" data-i18n="session"></p><p class="muted footnote" data-i18n="boundaries"></p></main>
<script src="domain-rules.js"></script><script src="policy.js"></script><script src="i18n.js"></script><script src="popup.js"></script></body></html>
