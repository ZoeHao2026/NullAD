name: Windows validation
on:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: node --test ui/tests/ui.test.cjs
      - run: cargo build --release --workspace --locked
      - run: python tests/e2e.py target/release/nullad-cli.exe
      - run: npx --yes @tauri-apps/cli@2.12.1 build --bundles nsis -- --locked
        working-directory: crates/nullad-desktop
      - run: ./scripts/package-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: nullad-windows
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
