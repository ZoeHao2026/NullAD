[package]
name = "nullad-cli"
description = "NullAD headless command line interface: check, load, bench, serve, dns, status."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "nullad-cli"
path = "src/main.rs"

[[bin]]
name = "nullad-perf"
path = "src/performance.rs"
required-features = ["performance"]

[[bin]]
name = "nullad-heuristic-perf"
path = "src/heuristic_performance.rs"
required-features = ["performance"]

[features]
performance = []
# Allocation instrumentation is absent from normal application builds.
profiling = ["performance", "dep:stats_alloc"]

[dependencies]
nullad-engine.workspace = true
nullad-api.workspace = true
nullad-intercept.workspace = true
nullad-host.workspace = true
nullad-core.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde_json.workspace = true
time.workspace = true
rand.workspace = true
rand_chacha.workspace = true
stats_alloc = { version = "0.1.10", optional = true }
