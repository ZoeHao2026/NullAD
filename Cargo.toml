[workspace]
resolver = "2"
members = [
    "crates/nullad-engine",
    "crates/nullad-api",
    "crates/nullad-intercept",
    "crates/nullad-host",
    "crates/nullad-core",
    "crates/nullad-cli",
    "crates/nullad-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
authors = ["NullAD Contributors"]
repository = "https://github.com/ZoeHao2026/NullAD"

[workspace.dependencies]
# --- internal ---
nullad-engine = { path = "crates/nullad-engine" }
nullad-api = { path = "crates/nullad-api" }
nullad-intercept = { path = "crates/nullad-intercept" }
nullad-host = { path = "crates/nullad-host" }
nullad-core = { path = "crates/nullad-core" }

# --- serialization ---
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.9"
# bincode 1.3 is used rather than 2.x: 2.x requires the `bincode_derive`
# proc-macro crate, which is not present in this host's offline registry cache.
bincode = "1.3"

# --- matching primitives ---
aho-corasick = "1.1"
regex = "1.13"
regex-automata = "0.4"
globset = "0.4"
idna = "1"

# --- collections / concurrency ---
hashbrown = { version = "0.16", features = ["default-hasher"] }
foldhash = "0.2"
ahash = "0.8"
indexmap = "2"
smallvec = { version = "1", features = ["union", "const_generics"] }
arc-swap = "1"
parking_lot = "0.12"

# --- async / io ---
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "fs", "signal"] }
futures-util = "0.3"
bytes = "1"

# --- http / tls ---
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client", "client-legacy", "http1"] }
http = "1"
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = "1"
webpki-roots = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

# --- crypto / certs (TLS MITM, phase 2) ---
ring = "0.17"
pem = "3"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"

# --- observability ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
tracing-appender = "0.2"

# --- platform ---
notify = "8"
dirs = "6"
thiserror = "2"
anyhow = "1"
libloading = "0.8"

# --- gui ---
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }

# --- utils ---
rand = "0.9"
rand_chacha = "0.9"
once_cell = "1"
flate2 = "1"
zstd = "0.13"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "macros"] }
humantime = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

# Benchmarks and profiling want symbols.
[profile.release.package.nullad-cli]
strip = "none"

# Fast-to-build profile used by the benchmark harness for quick iteration.
[profile.bench]
inherits = "release"
lto = "thin"
strip = "none"

[profile.dev]
opt-level = 0
debug = 1

# The MSVC C compiler on this machine fails with D8050 ("failed to get command
# line into debug records") when asked to emit debug info for large C translation
# units. The release profile strips symbols so it is unaffected; the debug and
# test profiles are not. Rust code keeps its debug info — only the C dependency
# loses it. See scripts/build.bat for the full diagnosis.
[profile.dev.package.ring]
debug = false

[profile.test.package.ring]
debug = false

